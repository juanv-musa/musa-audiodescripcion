<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap');
      .brand-title { font-family: 'Barlow Condensed', 'DIN Condensed', sans-serif; font-size: 38px; font-weight: 700; fill: #1E2822; letter-spacing: -0.5px; }
      .brand-subtitle { font-family: 'Barlow Condensed', 'DIN Condensed', sans-serif; font-size: 52px; font-weight: 800; fill: #384F3E; letter-spacing: -0.5px; line-height: 0.9; }
      .brand-location { font-family: 'Barlow Condensed', 'DIN Condensed', sans-serif; font-size: 34px; font-weight: 600; fill: #52725D; }
      .brand-tag { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; fill: #7E8C82; letter-spacing: 2px; text-transform: uppercase; }
      .logo-circle { fill: #DCDCD6; }
      .logo-wolf { fill: #384F3E; }
    </style>
  </defs>

  <!-- Emblema Circular con Cabeza de Lobo -->
  <g transform="translate(10, 10)">
    <!-- Círculo base tono piedra verdosa -->
    <circle cx="80" cy="80" r="75" class="logo-circle" />
    <circle cx="80" cy="80" r="74" fill="none" stroke="#52725D" stroke-width="2" opacity="0.3"/>
    
    <!-- Silueta estilizada del Lobo Ibérico del Pajarillo -->
    <path class="logo-wolf" d="
      M 32,86 
      C 32,83 36,81 44,80 
      C 52,79 62,76 72,68 
      C 76,64 78,57 80,48 
      C 81,42 85,38 92,37 
      C 99,36 109,39 122,46 
      C 131,43 141,45 146,50 
      C 147,51 144,55 138,58 
      C 134,60 128,62 121,63 
      C 126,67 136,70 142,75 
      C 143,76 140,80 134,81 
      C 126,82 118,80 114,77 
      C 116,84 122,93 124,105 
      C 126,116 122,128 116,138 
      C 114,142 108,145 102,143 
      C 96,141 90,132 86,128 
      C 80,123 74,116 71,108 
      C 69,114 62,118 54,117 
      C 47,116 43,110 40,105 
      C 37,100 32,93 32,86 Z
      M 48,88
      C 54,92 63,94 72,93
      C 75,93 78,89 77,85
      C 76,82 72,81 67,82
      C 59,83 53,85 48,88 Z
      M 86,63
      C 90,61 95,64 96,69
      C 97,73 93,76 89,75
      C 86,74 83,69 86,63 Z
    " />
    
    <!-- Detalle de hocico y fauces abiertas icónicas -->
    <path fill="#DCDCD6" d="
      M 42,87 
      Q 52,86 64,88 
      Q 68,91 66,95 
      Q 58,95 48,93 
      Z
    "/>
    <!-- Colmillo ibérico -->
    <polygon points="52,88 56,88 54,93" fill="#ffffff" />
    <polygon points="60,89 64,89 62,94" fill="#ffffff" />
  </g>

  <!-- Tipografía Oficial según Manual (DIN / Barlow Condensed) -->
  <g transform="translate(180, 20)">
    <text x="0" y="38" class="brand-title">Santuario</text>
    <text x="0" y="86" class="brand-subtitle">Ib&eacute;rico</text>
    <text x="0" y="126" class="brand-location">del Pajarillo</text>
    <text x="2" y="152" class="brand-tag">Centro de Interpretaci&oacute;n</text>
  </g>
</svg>
